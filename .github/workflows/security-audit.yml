name: Security Audit

on:
  schedule:
    - cron: "0 8 * * 1"  # co poniedziałek o 08:00 UTC
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --frozen
      - run: uv run --with pip-audit pip-audit
